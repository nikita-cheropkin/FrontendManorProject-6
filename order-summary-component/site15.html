<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="icon" href="Images/favicon-32x32.png">
    <link rel="stylesheet" href="css/site15.css">
</head>
<body>
    <picture>
        <source media="(max-width: 600px)" srcset="Images/pattern-background-mobile.svg">
        <img src="Images/pattern-background-desktop.svg" alt=""> 
    </picture>

    <div class="main-frame">
        <div class="header-img">
            <img src="Images/illustration-hero.svg" alt="">
        </div>

        <div class="content-frame">
            <h1>Order Summary</h1>
            <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>            
        
            <div class="annual-plan">
                <div class="first-part">
                    <img src="Images/icon-music.svg" alt="">

                    <div class="plan-text">
                        <h1>Annual Plan</h1>
                        <h2>$59.99/year</h2>
                    </div>                    
                </div>


                <a href="#">Change</a>
            </div>

            <button class="payment">Proceed to Payment</button>
            <button class="cancel-order">Cancel Order</button>
        </div>

    </div>
</body>
</html>
